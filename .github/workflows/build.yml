name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore GuidGenerator.sln

      - name: Build solution
        run: dotnet build GuidGenerator.sln --configuration Release --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            src/**/bin/Release/
            src/**/obj/
            tests/**/bin/Release/
            tests/**/obj/
  
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Restore dependencies
        run: dotnet restore GuidGenerator.sln

      - name: Run tests
        run: dotnet test GuidGenerator.sln --configuration Release --no-build --verbosity normal


  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Publish app
        run: dotnet publish src/GuidGeneratorApp/GuidGeneratorApp.csproj --configuration Release --output publish --no-build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuidGeneratorApp-Release
          path: publish
          retention-days: 1
